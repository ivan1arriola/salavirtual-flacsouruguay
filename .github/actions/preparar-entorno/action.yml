name: "Preparar entorno"
description: "Node 24 con caché npm, variables de CI compartidas e instalación reproducible. Requiere checkout previo."
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - name: Variables de CI compartidas
      shell: bash
      run: |
        {
          echo "CI=true"
          echo "NEXT_TELEMETRY_DISABLED=1"
          echo "APP_BASE_URL=https://salavirtual-ci.invalid"
          echo "TIMEZONE=America/Montevideo"
          echo "DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/flacso_ci?schema=public"
          echo "AUTH_SECRET=ci-only-not-for-production-0123456789-abcdefghijklmnopqrstuvwxyz"
          echo "AUTH_TRUST_HOST=true"
          echo "CONFIG_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        } >> "$GITHUB_ENV"
    - name: Instalar dependencias
      shell: bash
      run: npm ci --include=dev --prefer-offline --no-audit --no-fund

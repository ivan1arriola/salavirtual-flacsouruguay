name: "CI · Sala Virtual"
run-name: "CI · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'main' }} · ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-salavirtual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-types:
    name: "Validación de código"
    uses: ./.github/workflows/check-schema-types.yml

  eslint:
    name: "ESLint"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-entorno
      - id: lint_check
        run: npm run lint
      - name: Inventario JSON de ESLint
        if: failure() && steps.lint_check.outcome == 'failure'
        run: npm run lint -- --format json --output-file "$RUNNER_TEMP/eslint-debt.json"
      - name: Publicar inventario ESLint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint-debt-${{ github.sha }}
          path: ${{ runner.temp }}/eslint-debt.json
          if-no-files-found: ignore
          retention-days: 14

  prettier:
    name: "Prettier"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-entorno
      - id: format_check
        run: npm run format:check
      - name: Mostrar correcciones de formato
        if: failure() && steps.format_check.outcome == 'failure'
        run: |
          npm run format
          git --no-pager diff --binary -- . > "$RUNNER_TEMP/prettier-debt.patch"
          git --no-pager diff --stat
      - name: Publicar parche de formato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prettier-debt-${{ github.sha }}
          path: ${{ runner.temp }}/prettier-debt.patch
          if-no-files-found: ignore
          retention-days: 14

  knip:
    name: "Knip"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-entorno
      - run: npm run deadcode
      - name: Bloquear código muerto en producción
        if: always()
        run: npm run deadcode:production
      - name: Inventario de código muerto
        if: always()
        run: npm run --silent deadcode:report > "$RUNNER_TEMP/knip-debt.json"
      - name: Publicar inventario Knip
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: knip-debt-${{ github.sha }}
          path: ${{ runner.temp }}/knip-debt.json
          if-no-files-found: ignore
          retention-days: 14

  architecture:
    name: "Dependency Cruiser"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-entorno
      - name: Validar arquitectura completa
        run: |
          set -o pipefail
          npm run architecture 2>&1 | tee "$RUNNER_TEMP/architecture-debt.txt"
      - name: Publicar inventario de arquitectura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-debt-${{ github.sha }}
          path: ${{ runner.temp }}/architecture-debt.txt
          if-no-files-found: ignore
          retention-days: 14

  tests:
    name: "Pruebas"
    uses: ./.github/workflows/check-tests.yml

  security:
    name: "Auditoría alta y crítica"
    uses: ./.github/workflows/check-security.yml

  build:
    name: "Build producción"
    uses: ./.github/workflows/check-build.yml

  postgres:
    name: "PostgreSQL integrado"
    uses: ./.github/workflows/check-postgres.yml

  required-checks:
    name: "Validación completa · Deploy gate"
    if: always()
    needs: [schema-types, eslint, prettier, knip, architecture, tests, security, build, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluar todas las validaciones obligatorias
        shell: bash
        env:
          SCHEMA_RESULT: ${{ needs.schema-types.result }}
          ESLINT_RESULT: ${{ needs.eslint.result }}
          PRETTIER_RESULT: ${{ needs.prettier.result }}
          KNIP_RESULT: ${{ needs.knip.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          set -euo pipefail
          {
            echo "## Resultado de CI"
            echo
            echo "| Validación | Resultado |"
            echo "| --- | --- |"
            echo "| Esquema + TypeScript | ${SCHEMA_RESULT} |"
            echo "| ESLint | ${ESLINT_RESULT} |"
            echo "| Prettier | ${PRETTIER_RESULT} |"
            echo "| Knip | ${KNIP_RESULT} |"
            echo "| Arquitectura | ${ARCHITECTURE_RESULT} |"
            echo "| Tests + cobertura | ${TESTS_RESULT} |"
            echo "| Seguridad | ${SECURITY_RESULT} |"
            echo "| Build de producción | ${BUILD_RESULT} |"
            echo "| PostgreSQL integrado | ${POSTGRES_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          fallidas=()
          [[ "$SCHEMA_RESULT" == "success" ]] || fallidas+=("Esquema + TypeScript")
          [[ "$ESLINT_RESULT" == "success" ]] || fallidas+=("ESLint")
          [[ "$PRETTIER_RESULT" == "success" ]] || fallidas+=("Prettier")
          [[ "$KNIP_RESULT" == "success" ]] || fallidas+=("Knip")
          [[ "$ARCHITECTURE_RESULT" == "success" ]] || fallidas+=("Arquitectura")
          [[ "$TESTS_RESULT" == "success" ]] || fallidas+=("Tests + cobertura")
          [[ "$SECURITY_RESULT" == "success" ]] || fallidas+=("Seguridad")
          [[ "$BUILD_RESULT" == "success" ]] || fallidas+=("Build de producción")
          [[ "$POSTGRES_RESULT" == "success" ]] || fallidas+=("PostgreSQL integrado")
          if (( ${#fallidas[@]} > 0 )); then
            lista="$(printf '%s, ' "${fallidas[@]}")"
            {
              echo
              echo "**Fallaron:** ${lista%, }"
              echo
              echo "Detalle: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$SCHEMA_RESULT" != "success" || "$ESLINT_RESULT" != "success" || "$PRETTIER_RESULT" != "success" || "$KNIP_RESULT" != "success" || "$ARCHITECTURE_RESULT" != "success" || "$TESTS_RESULT" != "success" || "$SECURITY_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$POSTGRES_RESULT" != "success" ]]; then
            echo "::error title=Deploy bloqueado::Una o más validaciones fallaron, se cancelaron o fueron omitidas."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "Deploy EC2 habilitado tras CI completo." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PR aprobado por CI. El despliegue requiere un push a main." >> "$GITHUB_STEP_SUMMARY"
          fi

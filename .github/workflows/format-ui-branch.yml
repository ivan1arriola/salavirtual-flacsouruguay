name: Format UI branch once
on:
  push:
    branches:
      - feat/monitoreo-dashboard-presentation
    paths:
      - .github/workflows/format-ui-branch.yml
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/format-ui-branch.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/monitoreo-dashboard-presentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/monitoreo-dashboard-presentation
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - run: npm run format
      - run: npm run format:check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "style: aplicar Prettier al dashboard de monitoreo"
          git push origin HEAD:feat/monitoreo-dashboard-presentation

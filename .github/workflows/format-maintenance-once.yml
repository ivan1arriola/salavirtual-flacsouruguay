name: Format maintenance once
on:
  push:
    branches:
      - chore/ci-format-and-unused-meet
    paths:
      - .github/workflows/format-maintenance-once.yml
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/format-maintenance-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/chore/ci-format-and-unused-meet' || (github.event.pull_request.head.ref == 'chore/ci-format-and-unused-meet' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/ci-format-and-unused-meet
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - run: npm run format
      - run: npm run format:check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "style: aplicar Prettier al repositorio"
          git push origin HEAD:chore/ci-format-and-unused-meet

name: "Check · Pruebas y cobertura"
on:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    name: "Tests unitarios"
    # Activar solo después de registrar y verificar un runner aislado con etiqueta salavirtual-ci.
    runs-on: ${{ fromJSON(vars.SALAVIRTUAL_CI_RUNNER == 'self-hosted' && '["self-hosted","linux","x64","salavirtual-ci"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-entorno
      - name: Ejecutar pruebas
        run: npm test

  coverage:
    name: "Cobertura"
    runs-on: ${{ fromJSON(vars.SALAVIRTUAL_CI_RUNNER == 'self-hosted' && '["self-hosted","linux","x64","salavirtual-ci"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-entorno
      - name: Ejecutar pruebas y verificar cobertura
        run: npx vitest run --coverage --reporter=default --reporter=github-actions
      - name: Resumen de cobertura
        if: always()
        shell: bash
        run: |
          if [[ -f coverage/coverage-summary.json ]]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
              const report = JSON.parse(require("fs").readFileSync("coverage/coverage-summary.json", "utf8"));
              const t = report.total;
              const fila = (n, k) => `| ${n} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["## Cobertura integral (95% líneas, sentencias y funciones; 90% ramas)", "", "| Métrica | Cobertura | Cubierto |", "| --- | --- | --- |",
                fila("Líneas", "lines"), fila("Sentencias", "statements"), fila("Funciones", "functions"), fila("Ramas", "branches")].join("\n"));
          NODE
          else
            echo "No se generó informe de cobertura." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

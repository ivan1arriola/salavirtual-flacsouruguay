name: Format PR 285 files

on:
  push:
    branches:
      - fix/zoom-current-execution
    paths:
      - src/bootstrap/ui/reuniones/reunion-zoom-historica.tsx
      - src/bootstrap/ui/reuniones/reunion-zoom-operativa.tsx
      - src/bootstrap/ui/reuniones/zoom-inscriptos.tsx
      - src/integrations/zoom/zoom-live-participants.client.ts
      - test/estado-actual-zoom.test.ts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zoom-current-execution
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - name: Apply repository Prettier configuration
        run: npx prettier --write src/bootstrap/ui/reuniones/reunion-zoom-historica.tsx src/bootstrap/ui/reuniones/reunion-zoom-operativa.tsx src/bootstrap/ui/reuniones/zoom-inscriptos.tsx src/integrations/zoom/zoom-live-participants.client.ts test/estado-actual-zoom.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bootstrap/ui/reuniones/reunion-zoom-historica.tsx src/bootstrap/ui/reuniones/reunion-zoom-operativa.tsx src/bootstrap/ui/reuniones/zoom-inscriptos.tsx src/integrations/zoom/zoom-live-participants.client.ts test/estado-actual-zoom.test.ts
          git commit -m "style(zoom): apply Prettier formatting"
          git push origin HEAD:fix/zoom-current-execution

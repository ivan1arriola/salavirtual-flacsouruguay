name: "Check · PostgreSQL real"
on:
  workflow_call:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: flacso_meet_history_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d flacso_meet_history_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      MEET_HISTORY_DATABASE_TEST: "1"
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/flacso_meet_history_ci?schema=public"
      AUTH_SECRET: "ci-only-not-for-production-0123456789-abcdefghijklmnopqrstuvwxyz"
      AUTH_TRUST_HOST: "true"
      APP_BASE_URL: "https://salavirtual-ci.invalid"
      CONFIG_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - name: Preparar esquema descartable
        run: |
          npx prisma db push --skip-generate
          npx prisma db execute --schema prisma/schema.prisma --file prisma/migrations/20260914160000_historial_enlaces_meet/migration.sql
          npx prisma generate
      - name: Validar comportamiento contra PostgreSQL real
        run: npx vitest run test/meet-history-postgres.test.ts test/meet-link.test.ts test/meet-history.test.ts test/reverse-meet-search.test.ts test/f9-program-authorization-postgres.test.ts test/google-durable-operations-postgres.test.ts

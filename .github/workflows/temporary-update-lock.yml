name: "Temporal · Actualizar lockfile seguro"
on:
  push:
    branches:
      - fix/next-security-unblock-monitoreo

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile listo]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Recalcular lockfile y actualizar parches de seguridad
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund --audit-level=critical
          npm ci --include=dev
          npm audit --omit=dev --audit-level=critical
      - name: Guardar lockfile actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "fix(security): actualizar dependencias vulnerables [lockfile listo]"
          git push origin HEAD:fix/next-security-unblock-monitoreo

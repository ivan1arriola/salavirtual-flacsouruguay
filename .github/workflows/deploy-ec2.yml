name: "Deploy · EC2"
run-name: "Deploy EC2 · ${{ github.event.workflow_run.head_sha || github.sha }}"

on:
  workflow_run:
    workflows:
      - "CI · Sala Virtual"
    types:
      - completed

concurrency:
  group: deploy-ec2-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: "Deploy production"
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::577638382865:role/GitHubActionsSalaVirtualDeploy
      INSTANCE_ID: i-076bdbb899b710abe
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: "Credenciales AWS por OIDC"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "577638382865"
          role-session-name: salavirtual-${{ github.run_id }}

      - name: "Enviar deploy por SSM"
        id: ssm
        shell: bash
        run: |
          set -euo pipefail

          remote_command="SRC=/srv/apps/salavirtual-flacso/source; sudo -u ubuntu -H env PATH=/usr/bin:/bin:/usr/sbin:/sbin git -C \"\$SRC\" fetch --prune origin main && sudo -u ubuntu -H env PATH=/usr/bin:/bin:/usr/sbin:/sbin git -C \"\$SRC\" checkout -f main && sudo -u ubuntu -H env PATH=/usr/bin:/bin:/usr/sbin:/sbin git -C \"\$SRC\" reset --hard '${DEPLOY_SHA}' && sudo /bin/bash \"\$SRC/infra/ec2/deploy.sh\" '${DEPLOY_SHA}'"

          jq -n --arg command "$remote_command" '{commands:[$command]}' > /tmp/ssm-params.json

          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Sala Virtual deploy ${DEPLOY_SHA}" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $command_id"

      - name: "Esperar resultado y mostrar logs"
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          status="Pending"
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent \
            --output text || true

          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent \
            --output text || true

          if [[ "$status" != "Success" ]]; then
            echo "::error title=Deploy EC2 falló::SSM terminó con estado $status"
            exit 1
          fi

          {
            echo "## Deploy EC2"
            echo
            echo "Commit: \`${DEPLOY_SHA}\`"
            echo "Instancia: \`${INSTANCE_ID}\`"
            echo "SSM: \`${COMMAND_ID}\`"
            echo "Estado: **Success**"
          } >> "$GITHUB_STEP_SUMMARY"

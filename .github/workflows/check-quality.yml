name: "Check · Calidad de código"
on:
  workflow_call:
    inputs:
      command:
        type: string
        required: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-entorno
      - name: Ejecutar comprobación
        shell: bash
        env:
          QUALITY_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          case "$QUALITY_COMMAND" in
            eslint) npm run lint ;;
            prettier) npm run format:check ;;
            knip) npm run deadcode ;;
            architecture) npm run architecture ;;
            *) echo "::error::Comprobación desconocida"; exit 1 ;;
          esac

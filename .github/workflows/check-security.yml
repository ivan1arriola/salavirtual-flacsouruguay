name: "Check · Seguridad"
on:
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    # Activar solo después de registrar y verificar un runner aislado con etiqueta salavirtual-ci.
    runs-on: ${{ fromJSON(vars.SALAVIRTUAL_CI_RUNNER == 'self-hosted' && '["self-hosted","linux","x64","salavirtual-ci"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Auditoría alta y crítica de dependencias de producción
        # npm audit solo necesita package-lock.json: no hace falta instalar dependencias.
        run: |
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/audit-production.json"
      - name: Auditoría alta y crítica incluyendo desarrollo
        if: always()
        run: npm audit --audit-level=high --json > "$RUNNER_TEMP/audit-all.json"
      - name: Publicar inventario de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-debt-${{ github.sha }}
          path: ${{ runner.temp }}/audit-*.json
          if-no-files-found: ignore
          retention-days: 14

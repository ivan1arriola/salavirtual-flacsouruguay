name: "Check · Seguridad"
on:
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Auditoría crítica de dependencias de producción
        # npm audit solo necesita package-lock.json: no hace falta instalar dependencias.
        run: npm audit --omit=dev --audit-level=critical

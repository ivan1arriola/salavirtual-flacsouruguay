name: "Check · Esquema y tipos"
on:
  workflow_call:
permissions:
  contents: read
jobs:
  bash:
    name: "Scripts Bash"
    # Activar solo después de registrar y verificar un runner aislado con etiqueta salavirtual-ci.
    runs-on: ${{ fromJSON(vars.SALAVIRTUAL_CI_RUNNER == 'self-hosted' && '["self-hosted","linux","x64","salavirtual-ci"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validar sintaxis de scripts Bash de infraestructura
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find infra/ec2 scripts -type f -name '*.sh' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No se encontraron scripts Bash para validar"
            exit 1
          fi
          for script in "${files[@]}"; do
            echo "Verificando: $script"
            bash -n "$script"
          done

  schema:
    name: "Esquema Prisma"
    runs-on: ${{ fromJSON(vars.SALAVIRTUAL_CI_RUNNER == 'self-hosted' && '["self-hosted","linux","x64","salavirtual-ci"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-entorno
      - name: Validar esquema
        run: |
          npm run validate:schema
          npx prisma validate

  typescript:
    name: "TypeScript"
    runs-on: ${{ fromJSON(vars.SALAVIRTUAL_CI_RUNNER == 'self-hosted' && '["self-hosted","linux","x64","salavirtual-ci"]' || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-entorno
      - name: Comprobar TypeScript
        run: |
          set -o pipefail
          npm run check -- --pretty false 2>&1 | tee "$RUNNER_TEMP/typescript-debt.txt"
      - name: Publicar inventario TypeScript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typescript-debt-${{ github.sha }}
          path: ${{ runner.temp }}/typescript-debt.txt
          if-no-files-found: ignore
          retention-days: 14

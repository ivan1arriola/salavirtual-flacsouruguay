name: "Check · Esquema y tipos"
on:
  workflow_call:
permissions:
  contents: read
jobs:
  schema-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-entorno
      - name: Validar sintaxis de scripts Bash de infraestructura
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find infra/ec2 scripts -type f -name '*.sh' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No se encontraron scripts Bash para validar"
            exit 1
          fi
          for script in "${files[@]}"; do
            echo "Verificando: $script"
            bash -n "$script"
          done
      - name: Validar esquema
        run: |
          npm run validate:schema
          npx prisma validate
      - name: Comprobar TypeScript
        run: npm run check

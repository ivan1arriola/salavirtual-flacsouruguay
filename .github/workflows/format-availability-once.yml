name: Format availability branch
on:
  push:
    branches:
      - fix/monitoring-assistant-availability
    paths:
      - .github/workflows/format-availability-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/monitoring-assistant-availability
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run format
      - run: npm run lint -- --prune-suppressions
        continue-on-error: true
      - run: npm run format
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-availability-once.yml
          git add -u
          git commit -m "style: aplicar formato y retirar workflow temporal"
          git push origin HEAD:fix/monitoring-assistant-availability
      - run: npm run lint

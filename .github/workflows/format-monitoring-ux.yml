name: Format monitoring UX
on:
  push:
    branches:
      - fix/monitoring-coverage-management-ux
    paths:
      - .github/workflows/format-monitoring-ux.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/monitoring-coverage-management-ux
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run format
      - run: npm run lint -- --prune-suppressions
        continue-on-error: true
      - run: npm run format
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "style: format monitoring UX and prune obsolete suppressions"
          git push origin HEAD:fix/monitoring-coverage-management-ux
      - run: npm run lint

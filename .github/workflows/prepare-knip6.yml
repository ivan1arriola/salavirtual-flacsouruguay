name: Prepare Knip 6 upgrade
on:
  push:
    branches:
      - chore/prepare-dependabot-knip-6
    paths:
      - .github/workflows/prepare-knip6.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --save-dev --save-exact knip@6.45.1 --no-audit --no-fund
      - run: npm run db:generate
      - run: |
          node -e "const fs=require('node:fs'); const p='knip.jsonc'; fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('knip@5/schema.json','knip@6/schema.json'));"
          npx --no-install knip --help
          npx --no-install knip --fix --fix-type exports,types || true
      - run: npm run format
      - run: npm run lint -- --prune-suppressions
        continue-on-error: true
      - run: npm run format
      - run: |
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "chore: migrate Knip to v6 and remove unused exports"
          git push origin HEAD:chore/prepare-dependabot-knip-6
      - run: npm run deadcode

name: Format management redesign
on:
  push:
    branches:
      - feat/monitoring-management-redesign
    paths:
      - .github/workflows/format-management-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/monitoring-management-redesign
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - run: npm run format
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || git commit -m "style: aplicar Prettier al rediseño de gestión"
          git push origin HEAD:feat/monitoring-management-redesign
      - run: npm run format:check

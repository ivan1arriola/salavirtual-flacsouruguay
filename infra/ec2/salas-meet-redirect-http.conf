# Dominio histórico: conservar únicamente la redirección y el desafío ACME.
<VirtualHost *:80>
    ServerName salas-meet.flacso.edu.uy

    Alias /.well-known/acme-challenge/ /var/lib/letsencrypt/.well-known/acme-challenge/
    <Directory /var/lib/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://salavirtual.flacso.edu.uy%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

# Dominio histórico: no sirve la aplicación; redirige al nombre canónico.
<VirtualHost *:443>
    ServerName salas-meet.flacso.edu.uy

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/salas-meet.flacso.edu.uy/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/salas-meet.flacso.edu.uy/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    RewriteEngine On
    RewriteRule ^ https://salavirtual.flacso.edu.uy%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

# Directivas Apache para salavirtual.flacso.edu.uy
# Requiere: proxy, proxy_http, headers

ProxyPreserveHost On
ProxyPass / http://127.0.0.1:3101/ retry=0 timeout=300
ProxyPassReverse / http://127.0.0.1:3101/

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

# No aplicar cache HTTP al healthcheck.
<Location "/api/health">
    Header always set Cache-Control "no-store"
</Location>
